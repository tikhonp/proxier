name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Each job keeps a Go build cache of its own. With setup-go's cache the
      # two jobs shared one key, saved once per go.sum by whichever finished
      # first, so the other always started from a cache built for something
      # else: lint's for the -race builds, or the tests' for golangci-lint,
      # which needs its own (on a laptop: 2m20s cold, 18s with it).
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: Generated templ files are up to date
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          git diff --exit-code -- '*_templ.go' || (echo "::error::run templ generate and commit the result" && exit 1)

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # make test: -race everywhere except the packages that run real XHTTP
      # traffic through the embedded xray (its client has a race of its own).
      # The runner is ten times slower than a laptop or more, every package
      # running at once under -race: the tests' waits get ten times their
      # time (internal/platform/testwait) and each package an hour instead of
      # go test's 10 minutes.
      - name: Test
        env:
          PROXIER_TEST_PATIENCE: "10"
        run: make test GOTESTFLAGS=-timeout=60m

  # Lint and govulncheck don't wait for the tests: a runner of their own.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-

      # The version of the Dockerfile's lint stage: a new release would
      # throw the cache away and bring new findings unasked.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # Fails on every vulnerability our code reaches.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Images are built only from a commit whose tests and lint passed
  # (docs/deployment.md#images-and-ci): a push to main tags :<sha>, :main and
  # :latest (blackberry follows :latest); a v* tag tags :<tag>. They go to
  # this Forgejo's registry: its automatic token can't write packages, so
  # REGISTRY_TOKEN is an access token with write:package (as in
  # music-download-bot).
  image:
    needs: [test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      REGISTRY: code.tikhonnnnn.com
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve image tags
        id: version
        run: |
          IMAGE="${REGISTRY}/${{ github.repository }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${IMAGE}:${{ github.ref_name }}"
          else
            TAGS="${IMAGE}:${{ github.sha }},${IMAGE}:${{ github.ref_name }},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.version.outputs.tags }}
